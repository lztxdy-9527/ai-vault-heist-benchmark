    function computeDynamicVisibleMask(terrain, hx, hy, gatesFlipped = false, platesActive = false) {
      const mask = Array.from({ length: GRID_H }, () => Array(GRID_W).fill(false));
      const highWall = (x, y) => {
        if (x < 0 || x >= GRID_W || y < 0 || y >= GRID_H) return true;
        const tile = terrain[y][x];
        return tile === "T_W" || tile === "W" || tile.startsWith("LASER_") || tile.startsWith("LASER2_")
          || (tile === "R_GATE" && !gatesFlipped) || (tile === "B_GATE" && gatesFlipped)
          || (tile === "P_GATE" && !platesActive);
      };
      const open = (dx, dy) => {
        const x = hx+dx, y = hy+dy;
        return x >= 0 && x < GRID_W && y >= 0 && y < GRID_H && mask[y][x] && !highWall(x,y);
      };
      for (let radius=0; radius<=3; radius++) {
        for (let dy=-radius; dy<=radius; dy++) for (let dx=-radius; dx<=radius; dx++) {
          if (Math.max(Math.abs(dx),Math.abs(dy)) !== radius || dx*dx+dy*dy>10) continue;
          const x=hx+dx, y=hy+dy;
          if (x<0 || x>=GRID_W || y<0 || y>=GRID_H) continue;
          const sx=Math.sign(dx), sy=Math.sign(dy);
          if (radius<=1) mask[y][x]=true;
          else if (dx===0 || dy===0) mask[y][x]=open(dx-sx,dy-sy);
          else if (Math.abs(dx)===Math.abs(dy)) mask[y][x]=open(sx,sy) && !(highWall(hx+sx,hy)&&highWall(hx,hy+sy));
          else if (Math.abs(dx)>Math.abs(dy)) mask[y][x]=open(dx-sx,dy)||open(dx-sx,dy-sy);
          else mask[y][x]=open(dx,dy-sy)||open(dx-sx,dy-sy);
        }
      }
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const ax = hx + dx, ay = hy + dy;
          if (ax < 0 || ax >= GRID_W || ay < 0 || ay >= GRID_H) continue;
          const t0 = terrain[ay] && terrain[ay][ax];
          if (t0 === "ICE" || (t0 && t0.startsWith("MIRROR_"))) {
            const dirs = (dx === 0 || dy === 0) ? [[dx, dy]] : [[0,-1],[0,1],[-1,0],[1,0]];
            for (const d0 of dirs) {
              let cx = ax, cy = ay, curD = d0;
              for (let s = 0; s < 32; s++) {
                if (cx < 0 || cx >= GRID_W || cy < 0 || cy >= GRID_H) break;
                mask[cy][cx] = true;
                const ct = terrain[cy][cx];
                if (MIRROR_MAP[ct]) curD = MIRROR_MAP[ct][`${curD[0]},${curD[1]}`];
                else if (ct !== "ICE") break;
                cx += curD[0];
                cy += curD[1];
              }
            }
          }
        }
      }
      return mask;
    }

    // 重建真实物理移动路径（解决旧 JSON 回放因 sorted(exposed_cells) 导致的倒走与折返 Bug）
    function buildOrderedHeroPath(prevFrame, curFrame) {
      if (curFrame._orderedPath) return curFrame._orderedPath;

      const startPos = prevFrame ? prevFrame.hero_pos : curFrame.hero_pos;
      const endPos = curFrame.hero_pos;
      const moves = (curFrame.events || []).filter(e => e.type === "HERO_MOVE");
      if (moves.length) {
        curFrame._orderedPath = [moves[0].from, ...moves.map(e => e.to)];
        return curFrame._orderedPath;
      }
      const raw = curFrame.exposed_cells || [];

      if (!prevFrame || raw.length <= 1 || (raw.length === 2 && startPos[0] === endPos[0] && startPos[1] === endPos[1])) {
        curFrame._orderedPath = [endPos];
        return curFrame._orderedPath;
      }

      if (raw.length === 2) {
        curFrame._orderedPath = [startPos, endPos];
        return curFrame._orderedPath;
      }

      // 超过 2 格（滑冰 / 跳板 / 传送门）：从 startPos 出发按真实移动方向串联所有途径格到 endPos
      const pool = [];
      const seen = new Set();
      for (const c of raw) {
        const k = `${c[0]},${c[1]}`;
        if (k === `${startPos[0]},${startPos[1]}` || k === `${endPos[0]},${endPos[1]}`) continue;
        if (!seen.has(k)) {
          seen.add(k);
          pool.push([c[0], c[1]]);
        }
      }

      const path = [startPos];
      let cur = startPos;
      let prevDir = null;

      while (pool.length > 0) {
        let bestIdx = -1;
        let bestScore = Infinity;

        for (let i = 0; i < pool.length; i++) {
          const p = pool[i];
          const dx = p[0] - cur[0];
          const dy = p[1] - cur[1];
          const dist = Math.abs(dx) + Math.abs(dy);
          let score = dist * 10;

          if (dist === 1) {
            score = 1;
            if (prevDir && dx === prevDir[0] && dy === prevDir[1]) score = 0; // 优先延续滑冰惯性方向
          } else if ((dx === 0 || dy === 0) && dist <= 3) {
            score = 5 + dist; // 跨跳/弹簧短距直线
          }
          if (score < bestScore) {
            bestScore = score;
            bestIdx = i;
          }
        }

        if (bestIdx === -1) break;
        const next = pool.splice(bestIdx, 1)[0];
        const ndx = Math.sign(next[0] - cur[0]);
        const ndy = Math.sign(next[1] - cur[1]);
        if (Math.abs(next[0] - cur[0]) + Math.abs(next[1] - cur[1]) <= 3) {
          prevDir = [ndx, ndy];
        } else {
          prevDir = null;
        }
        path.push(next);
        cur = next;
      }

      if (cur[0] !== endPos[0] || cur[1] !== endPos[1]) {
        path.push(endPos);
      }

      curFrame._orderedPath = path;
      return path;
    }

    // 1:1 完整 v2.2 FULL 确定性模拟引擎（供离线踢馆模式直接挑战任何地图）
    class ClientDungeonSimulator {
      constructor(sourceFrame, meta) {
        this.demon_id = meta.demon_id || "official";
        this.demon_name = meta.demon_name || "官方一图";
        this.terrain = sourceFrame.terrain.map(r => r.slice());
        this.occupant = sourceFrame.occupant.map(r => r.slice());
        this.clues = sourceFrame.clues.map(r => r.slice());
        this.plateCells = [];
        for (let y = 1; y < GRID_H - 1; y++) {
          for (let x = 1; x < GRID_W - 1; x++) {
            if (this.terrain[y][x] === "PLATE") this.plateCells.push([x, y]);
          }
        }
        this.bombs = [];
        this.nextBombId = 1;
        this.turn = 1;
        this.hx = 2;
        this.hy = 13;
        this.hp = 100;
        this.keys = [false, false];
        this.jumps = 3;
        this.throws = 3;
        this.bombs_left = 2;
        this.gates_flipped = false;
        this.status = "ALIVE";
        this.trap_damage_total = 0;
        this.exposed_cells = [[2, 13]];
        this.events = [];
        this.last_pre_action_warnings = [];

        this.mimicToClue = {};
        const boundClues = new Set();
        for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++) {
          if (this.terrain[y][x] !== "MIMIC") continue;
          for (const [dx, dy] of Object.values(DIR_VECS)) {
            const nx = x + dx, ny = y + dy;
            if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) continue;
            const ck = `${nx},${ny}`;
            if (this.terrain[ny][nx] !== "EMPTY" || this.occupant[ny][nx] !== null ||
                (nx >= 1 && nx <= 3 && ny >= 12 && ny <= 14) || boundClues.has(ck)) continue;
            const otherChest = Object.values(DIR_VECS).some(([ax, ay]) => {
              const cx = nx + ax, cy = ny + ay;
              return !(cx === x && cy === y) && ["HEAL", "MIMIC"].includes(this.terrain[cy]?.[cx]);
            });
            if (!otherChest) { this.mimicToClue[`${x},${y}`] = [nx, ny]; boundClues.add(ck); break; }
          }
        }
        this.portalMap = {};
        const pts = {};
        for (let y = 0; y < GRID_H; y++) {
          for (let x = 0; x < GRID_W; x++) {
            const t = this.terrain[y][x];
            if (t && t.startsWith("PORTAL_")) pts[t] = [x, y];
          }
        }
        if (pts.PORTAL_1A && pts.PORTAL_1B) {
          this.portalMap[`${pts.PORTAL_1A[0]},${pts.PORTAL_1A[1]}`] = pts.PORTAL_1B;
          this.portalMap[`${pts.PORTAL_1B[0]},${pts.PORTAL_1B[1]}`] = pts.PORTAL_1A;
        }
        if (pts.PORTAL_2A && pts.PORTAL_2B) {
          this.portalMap[`${pts.PORTAL_2A[0]},${pts.PORTAL_2A[1]}`] = pts.PORTAL_2B;
          this.portalMap[`${pts.PORTAL_2B[0]},${pts.PORTAL_2B[1]}`] = pts.PORTAL_2A;
        }
      }

      isPlatesActive() {
        return this.plateCells.length > 0 && this.plateCells.every(([px, py]) => this.occupant[py][px] === "BOX");
      }

      blocksOneway(x, y, moveDir) {
        if (!moveDir || x < 0 || x >= GRID_W || y < 0 || y >= GRID_H) return false;
        const t = this.terrain[y][x];
        if (!t || !t.startsWith("ONEWAY_")) return false;
        const allowed = DIR_VECS[t.split("_")[1]];
        return !allowed || allowed[0] !== moveDir[0] || allowed[1] !== moveDir[1];
      }

      isHighWall(x, y) {
        if (x < 0 || x >= GRID_W || y < 0 || y >= GRID_H) return true;
        const t = this.terrain[y][x];
        if (t === "W" || t === "T_W" || (t && (t.startsWith("LASER_") || t.startsWith("LASER2_")))) return true;
        if (t === "R_GATE" && !this.gates_flipped) return true;
        if (t === "B_GATE" && this.gates_flipped) return true;
        if (t === "P_GATE" && !this.isPlatesActive()) return true;
        return false;
      }

      isEnterable(x, y, entity, moveDir = null) {
        if (this.isHighWall(x, y)) return false;
        if (this.blocksOneway(x, y, moveDir)) return false;
        if (this.occupant[y][x] === "BOX" || this.occupant[y][x] === "TNT") return false;
        if (entity === "BOX") {
          if (x === this.hx && y === this.hy) return false;
          const t = this.terrain[y][x];
          if (t === "K1" || t === "K2" || t === "V") return false;
        }
        return true;
      }

      applyDamage(trapNominal, selfNominal) {
        const tot = trapNominal + selfNominal;
        if (tot <= 0 || this.hp <= 0) return;
        const effTrap = Math.min(this.hp, tot) * (trapNominal / tot);
        this.trap_damage_total = Math.min(100, this.trap_damage_total + effTrap);
        this.hp -= tot;
        this.events.push({ type: "DAMAGE", trap_nominal: trapNominal, self_nominal: selfNominal, hp_after: this.hp });
        if (this.hp <= 0) this.status = "DEAD";
      }

      displace(entity, p0, p1, dir, tracker, viaPortal = false) {
        if (this.status !== "ALIVE") return;
        const [x0, y0] = p0;
        const [x1, y1] = p1;
        tracker.steps += 1;

        if (this.terrain[y0][x0] === "CRACK") {
          this.terrain[y0][x0] = "PIT";
          this.events.push({ type: "CRACK_COLLAPSE", x: x0, y: y0 });
        }

        if (entity === "BOX") {
          this.occupant[y0][x0] = null;
          this.occupant[y1][x1] = "BOX";
        } else {
          this.events.push({type: "HERO_MOVE", from: [x0, y0], to: [x1, y1]});
          this.hx = x1;
          this.hy = y1;
          this.exposed_cells.push([x1, y1]);
        }

        const t1 = this.terrain[y1][x1];
        if (entity === "BOX") {
          if (t1 === "PIT") {
            this.occupant[y1][x1] = null;
            this.terrain[y1][x1] = "EMPTY";
            return;
          } else if (t1 === "MIMIC") {
            this.clearMimic(x1, y1);
          } else if (t1 === "SWITCH") {
            this.gates_flipped = !this.gates_flipped;
          }
        } else {
          if (t1 === "PIT") {
            this.applyDamage(100, 0);
          } else if (t1 === "MIMIC") {
            this.clearMimic(x1, y1);
            tracker.stop = true;
            this.applyDamage(45, 0);
          } else if (t1 === "HEAL") {
            this.hp = Math.min(100, this.hp + 30);
            this.terrain[y1][x1] = "EMPTY";
            this.events.push({ type: "HEAL", x: x1, y: y1, hp_after: this.hp });
          } else if (t1 === "SWITCH") {
            this.gates_flipped = !this.gates_flipped;
          }
        }

        if (this.status !== "ALIVE") return;

        if (entity === "HERO") {
          const tn = this.terrain[y1][x1];
          if (tn === "K1") { this.keys[0] = true; this.terrain[y1][x1] = "EMPTY"; }
          if (tn === "K2") { this.keys[1] = true; this.terrain[y1][x1] = "EMPTY"; }
          if (tn === "V" && this.keys[0] && this.keys[1] && this.hp > 0) {
            this.status = "CLEARED";
            return;
          }
        }

        if (tracker.steps >= 32 || tracker.stop) return;

        if (viaPortal) {
          if (tracker.portals >= 2) return;
          const nx = x1 + dir[0], ny = y1 + dir[1];
          if (this.isEnterable(nx, ny, entity, dir)) {
            this.displace(entity, [x1, y1], [nx, ny], dir, tracker, false);
          }
          return;
        }

        const tc = this.terrain[y1][x1];
        if (tc === "ICE") {
          const nx = x1 + dir[0], ny = y1 + dir[1];
          if (this.isEnterable(nx, ny, entity, dir)) {
            this.displace(entity, [x1, y1], [nx, ny], dir, tracker, false);
          }
        } else if (MIRROR_MAP[tc]) {
          const nd = MIRROR_MAP[tc][`${dir[0]},${dir[1]}`];
          const nx = x1 + nd[0], ny = y1 + nd[1];
          if (this.isEnterable(nx, ny, entity, nd)) {
            this.displace(entity, [x1, y1], [nx, ny], nd, tracker, false);
          }
        } else if (tc && tc.startsWith("SPRING_")) {
          const sd = DIR_VECS[tc.split("_")[1]];
          let blockedK = null;
          for (let k = 1; k <= 3; k++) {
            const kx = x1 + k * sd[0], ky = y1 + k * sd[1];
            if (!this.isEnterable(kx, ky, entity, sd)) {
              blockedK = k;
              if (entity === "BOX" && ky >= 0 && ky < GRID_H && kx >= 0 && kx < GRID_W && this.occupant[ky][kx] === "TNT") {
                this.tntArmed.add(`${kx},${ky}`);
              }
              break;
            }
          }
          if (blockedK === 1) return;
          const landK = blockedK ? blockedK - 1 : 3;
          this.displace(entity, [x1, y1], [x1 + landK * sd[0], y1 + landK * sd[1]], sd, tracker, false);
        } else if (tc && tc.startsWith("PORTAL_")) {
          if (tracker.portals >= 2) return;
          const pair = this.portalMap[`${x1},${y1}`];
          if (pair && this.isEnterable(pair[0], pair[1], entity, null)) {
            tracker.portals += 1;
            this.displace(entity, [x1, y1], pair, dir, tracker, true);
          }
        }
      }

      clearMimic(x, y) {
        this.terrain[y][x] = "EMPTY";
        const clue = this.mimicToClue[`${x},${y}`];
        if (clue) this.clues[clue[1]][clue[0]] = false;
        delete this.mimicToClue[`${x},${y}`];
      }

      executeThrow(direction) {
        if (this.throws <= 0) return;
        this.throws--;
        let sx = this.hx, sy = this.hy, cd = direction, portals = 0;
        const enter = () => {
          sx += cd[0]; sy += cd[1];
          if (this.isHighWall(sx, sy) || this.occupant[sy][sx] === "BOX") return false;
          if (this.occupant[sy][sx] === "TNT") { this.tntArmed.add(`${sx},${sy}`); return false; }
          const t = this.terrain[sy][sx];
          if (t === "SWITCH") { this.gates_flipped = !this.gates_flipped; return false; }
          if (t === "MIMIC") { this.clearMimic(sx, sy); return false; }
          if (MIRROR_MAP[t]) cd = MIRROR_MAP[t][`${cd[0]},${cd[1]}`];
          else if (t.startsWith("PORTAL_") && portals < 2) {
            const pair = this.portalMap[`${sx},${sy}`];
            if (pair && !this.isHighWall(...pair) && !this.occupant[pair[1]][pair[0]]) {
              [sx, sy] = pair;
              if (++portals >= 2) return false;
              return "PORTAL";
            }
          }
          return true;
        };
        for (let k = 0; k < 6; k++) if (!enter()) return;
        if (this.terrain[sy][sx] !== "ICE" && !MIRROR_MAP[this.terrain[sy][sx]]) return;
        for (let k = 0; k < 32; k++) {
          const result = enter();
          if (!result) return;
          const t = this.terrain[sy][sx];
          if (result !== "PORTAL" && t !== "ICE" && !MIRROR_MAP[t]) return;
        }
      }

      step(action) {
        if (this.status !== "ALIVE") return this.toFrame(action);
        this.last_pre_action_warnings = this.computeLaserWarnings(this.turn);
        this.exposed_cells = [[this.hx, this.hy]];
        this.events = [];
        this.tntArmed = new Set();

        if (action === "BOMB") {
          if (this.bombs_left > 0 && !this.bombs.some(b => b.x === this.hx && b.y === this.hy)) {
            this.bombs_left -= 1;
            this.bombs.push({ id: this.nextBombId++, x: this.hx, y: this.hy, timer: 3 });
          }
        } else if (action.startsWith("MOVE_")) {
          const d = DIR_VECS[action.split("_")[1]];
          const x1 = this.hx + d[0], y1 = this.hy + d[1];
          if (!this.isHighWall(x1, y1) && !this.blocksOneway(x1, y1, d) && this.occupant[y1][x1] !== "TNT") {
            if (this.occupant[y1][x1] === "BOX") {
              const x2 = this.hx + 2 * d[0], y2 = this.hy + 2 * d[1];
              if (this.isEnterable(x2, y2, "BOX", d)) {
                this.displace("BOX", [x1, y1], [x2, y2], d, { steps: 0, portals: 0, stop: false });
                if (this.status === "ALIVE" && this.isEnterable(x1, y1, "HERO", d)) {
                  this.displace("HERO", [this.hx, this.hy], [x1, y1], d, { steps: 0, portals: 0, stop: false });
                }
              }
            } else {
              this.displace("HERO", [this.hx, this.hy], [x1, y1], d, { steps: 0, portals: 0, stop: false });
            }
          }
        } else if (action.startsWith("JUMP_")) {
          if (this.jumps > 0) {
            this.jumps -= 1;
            const d = DIR_VECS[action.split("_")[1]];
            const x1 = this.hx + d[0], y1 = this.hy + d[1];
            const x2 = this.hx + 2 * d[0], y2 = this.hy + 2 * d[1];
            if (!this.isHighWall(x1, y1) && !this.blocksOneway(x1, y1, d) && this.isEnterable(x2, y2, "HERO", d)) {
              this.displace("HERO", [this.hx, this.hy], [x2, y2], d, { steps: 0, portals: 0, stop: false });
            }
          }
        } else if (action.startsWith("THROW_")) {
          this.executeThrow(DIR_VECS[action.split("_")[1]]);
        }

        if (this.status !== "ALIVE") return this.toFrame(action);

        this.bombs.forEach(b => b.timer -= 1);
        const initBombs = this.bombs.filter(b => b.timer <= 0).map(b => b.id);
        this.resolveExplosions(initBombs, Array.from(this.tntArmed));
        if (this.status !== "ALIVE") return this.toFrame(action);

        const fireRed = (this.turn % 3 === 0);
        const fireBlue = (this.turn % 4 === 0);
        if (fireRed || fireBlue) {
          const beams = [];
          const hitTnts = [];
          for (let y = 1; y < GRID_H - 1; y++) {
            for (let x = 1; x < GRID_W - 1; x++) {
              const t = this.terrain[y][x];
              let period = 0, dKey = "";
              if (t && t.startsWith("LASER_") && fireRed) { period = 3; dKey = t.split("_")[1]; }
              else if (t && t.startsWith("LASER2_") && fireBlue) { period = 4; dKey = t.split("_")[1]; }
              if (!period) continue;
              const dv = DIR_VECS[dKey];
              const cells = [];
              for (let k = 1; k <= 10; k++) {
                const bx = x + k * dv[0], by = y + k * dv[1];
                if (this.isHighWall(bx, by) || this.occupant[by][bx] === "BOX") break;
                if (this.occupant[by][bx] === "TNT") { hitTnts.push(`${bx},${by}`); break; }
                cells.push([bx, by]);
              }
              beams.push({ cannon: [x, y], dir: dKey, period, cells });
            }
          }
          let hits = 0;
          for (const bm of beams) {
            if (bm.cells.some(c => this.exposed_cells.some(ec => ec[0] === c[0] && ec[1] === c[1]))) hits += 1;
          }
          if (beams.length > 0) this.events.push({ type: "LASER_FIRE", beams, hero_hits: hits });
          if (hits > 0) this.applyDamage(50 * hits, 0);
          if (this.status === "ALIVE" && hitTnts.length > 0) this.resolveExplosions([], hitTnts);
        }

        const executedTurn = this.turn;
        if (this.turn >= MAX_TURNS && this.status === "ALIVE") this.status = "TIMEOUT";
        else if (this.status === "ALIVE") this.turn += 1;

        return this.toFrame(action, executedTurn);
      }

      resolveExplosions(bombIds, tntKeys) {
        if (bombIds.length === 0 && tntKeys.length === 0) return;
        const expBombs = new Set(bombIds);
        const expTnts = new Set(tntKeys);
        const queue = [];
        this.bombs.forEach(b => { if (expBombs.has(b.id)) queue.push([b.x, b.y, "BOMB"]); });
        tntKeys.forEach(k => { const [x, y] = k.split(",").map(Number); queue.push([x, y, "TNT"]); });

        const blastCells = [];
        const blastSet = new Set();
        let qi = 0;
        while (qi < queue.length) {
          const [ex, ey] = queue[qi++];
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const cx = ex + dx, cy = ey + dy;
              if (cx < 0 || cx >= GRID_W || cy < 0 || cy >= GRID_H) continue;
              const ck = `${cx},${cy}`;
              if (!blastSet.has(ck)) { blastSet.add(ck); blastCells.push([cx, cy]); }
              if (this.occupant[cy][cx] === "TNT" && !expTnts.has(ck)) {
                expTnts.add(ck); queue.push([cx, cy, "TNT"]);
              }
              this.bombs.forEach(b => {
                if (b.x === cx && b.y === cy && !expBombs.has(b.id)) {
                  expBombs.add(b.id); queue.push([b.x, b.y, "BOMB"]);
                }
              });
            }
          }
        }

        let trapNom = 0, selfNom = 0;
        for (const [ex, ey, kind] of queue) {
          if (Math.abs(this.hx - ex) <= 1 && Math.abs(this.hy - ey) <= 1) {
            if (kind === "TNT") trapNom += 60; else selfNom += 50;
          }
        }
        if (trapNom + selfNom > 0) this.applyDamage(trapNom, selfNom);

        this.bombs = this.bombs.filter(b => !expBombs.has(b.id));
        expTnts.forEach(k => {
          const [tx, ty] = k.split(",").map(Number);
          if (this.occupant[ty][tx] === "TNT") this.occupant[ty][tx] = null;
        });

        this.events.push({ type: "EXPLOSION_BATCH", blast_cells: blastCells });

        const immune = new Set([
          "T_W", "K1", "K2", "V", "PORTAL_1A", "PORTAL_1B", "PORTAL_2A", "PORTAL_2B", "PIT",
          "PLATE", "P_GATE", "ONEWAY_U", "ONEWAY_D", "ONEWAY_L", "ONEWAY_R"
        ]);
        for (const [cx, cy] of blastCells) {
          if (this.occupant[cy][cx] === "BOX") this.occupant[cy][cx] = null;
          const t = this.terrain[cy][cx];
          if (immune.has(t)) continue;
          if (t === "MIMIC") this.clearMimic(cx, cy);
          else if (t === "CRACK") this.terrain[cy][cx] = "PIT";
          else this.terrain[cy][cx] = "EMPTY";
        }
        if (this.hp > 0 && this.status === "ALIVE" && this.terrain[this.hy][this.hx] === "PIT") {
          this.applyDamage(100, 0);
        }
      }

      computeLaserWarnings(forTurn = this.turn) {
        const fireRed = (forTurn > 0 && forTurn % 3 === 0);
        const fireBlue = (forTurn > 0 && forTurn % 4 === 0);
        if (!fireRed && !fireBlue) return [];
        const warningMap = new Map();
        for (let y = 1; y < GRID_H - 1; y++) {
          for (let x = 1; x < GRID_W - 1; x++) {
            const t = this.terrain[y][x];
            let period = 0, dKey = "";
            if (t && t.startsWith("LASER_") && fireRed) { period = 3; dKey = t.split("_")[1]; }
            else if (t && t.startsWith("LASER2_") && fireBlue) { period = 4; dKey = t.split("_")[1]; }
            if (!period || !DIR_VECS[dKey]) continue;
            const dv = DIR_VECS[dKey];
            for (let k = 1; k <= 10; k++) {
              const bx = x + k * dv[0], by = y + k * dv[1];
              if (bx < 0 || bx >= GRID_W || by < 0 || by >= GRID_H) break;
              if (this.isHighWall(bx, by) || this.occupant[by][bx] === "BOX" || this.occupant[by][bx] === "TNT") break;
              const key = `${by},${bx},${dKey},${period},${x},${y}`;
              if (!warningMap.has(key)) {
                warningMap.set(key, { x: bx, y: by, dir: dKey, period, cannon: [x, y] });
              }
            }
          }
        }
        return Array.from(warningMap.values()).sort((a, b) =>
          (a.y - b.y) ||
          (a.x - b.x) ||
          (a.dir < b.dir ? -1 : a.dir > b.dir ? 1 : 0) ||
          (a.period - b.period) ||
          (a.cannon[0] - b.cannon[0]) ||
          (a.cannon[1] - b.cannon[1])
        );
      }

      toFrame(action, turnNum = this.turn) {
        const lw = (turnNum === 0)
          ? this.computeLaserWarnings(1)
          : (this.last_pre_action_warnings
              ? this.last_pre_action_warnings.map(w => ({ ...w, cannon: [...w.cannon] }))
              : this.computeLaserWarnings(turnNum));
        return {
          turn: turnNum,
          action,
          status: this.status,
          hero_pos: [this.hx, this.hy],
          hero_hp: this.hp,
          keys: [...this.keys],
          jumps: this.jumps,
          throws: this.throws,
          bombs_left: this.bombs_left,
          gates_flipped: this.gates_flipped,
          plates_active: this.isPlatesActive(),
          trap_damage_total: this.trap_damage_total,
          exposed_cells: this.exposed_cells.map(c => [...c]),
          laser_warnings: lw,
          events: this.events,
          terrain: this.terrain.map(r => r.slice()),
          occupant: this.occupant.map(r => r.slice()),
          bombs: this.bombs.map(b => ({ ...b })),
          clues: this.clues.map(r => r.slice())
        };
      }
    }

    // ============================================================================
    // 4. 2.5D 像素地下城渲染管线（纯像素纹理 + 真 2.5D 纵深遮挡 + 迷雾全裁切 + 无残影无蓝轨）
    // ============================================================================
    function drawRoundedRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    function drawSpriteAt(ctx, sprite, dx, dy, dw, dh) {
      if (!sprite) return;
      ctx.drawImage(sprite, Math.round(dx), Math.round(dy), Math.round(dw), Math.round(dh));
    }

    function isTallOccluder(terrain, x, y, gatesFlipped, platesActive = false) {
      if (y < 0 || y >= GRID_H || x < 0 || x >= GRID_W) return false;
      const t = terrain[y][x];
      if (t === "T_W" || t === "W" || t === "V" || (t && (t.startsWith("LASER_") || t.startsWith("LASER2_")))) return true;
      if (t === "R_GATE" && !gatesFlipped) return true;
      if (t === "B_GATE" && gatesFlipped) return true;
      if (t === "P_GATE" && !platesActive) return true;
      return false;
    }

    function drawFloorAndFlatTile(ctx, type, gx, gy, px, py, gatesFlipped, platesActive, occType, nowMs) {
      // 1. 基础地下城石砖地板
      const floorSpr = ((gx * 7 + gy * 13) & 1) === 0 ? SPRITES.FLOOR_A : SPRITES.FLOOR_B;
      drawSpriteAt(ctx, floorSpr, px, py, TILE_SIZE, TILE_SIZE);

      // 2. 扁平地表陷阱/机关（紧贴 32x32 格子）
      if (type === "PIT") {
        drawSpriteAt(ctx, SPRITES.PIT, px, py, TILE_SIZE, TILE_SIZE);
      } else if (type === "ICE") {
        drawSpriteAt(ctx, SPRITES.ICE, px, py, TILE_SIZE, TILE_SIZE);
      } else if (type === "CRACK") {
        drawSpriteAt(ctx, SPRITES.CRACK, px, py, TILE_SIZE, TILE_SIZE);
      } else if (type === "SWITCH") {
        drawSpriteAt(ctx, gatesFlipped ? SPRITES.SWITCH_BLUE : SPRITES.SWITCH_RED, px, py, TILE_SIZE, TILE_SIZE);
      } else if (type === "R_GATE" && gatesFlipped) {
        drawSpriteAt(ctx, SPRITES.R_GATE_OPEN, px, py, TILE_SIZE, TILE_SIZE);
      } else if (type === "B_GATE" && !gatesFlipped) {
        drawSpriteAt(ctx, SPRITES.B_GATE_OPEN, px, py, TILE_SIZE, TILE_SIZE);
      } else if (type === "PLATE") {
        drawSpriteAt(ctx, (occType === "BOX" || platesActive) ? SPRITES.PLATE_ON : SPRITES.PLATE_OFF, px, py, TILE_SIZE, TILE_SIZE);
      } else if (type === "P_GATE" && platesActive) {
        drawSpriteAt(ctx, SPRITES.P_GATE_OPEN, px, py, TILE_SIZE, TILE_SIZE);
      } else if (type && type.startsWith("ONEWAY_")) {
        drawSpriteAt(ctx, SPRITES[type], px, py, TILE_SIZE, TILE_SIZE);
      } else if (type && type.startsWith("PORTAL_")) {
        const spr = type.startsWith("PORTAL_1") ? SPRITES.PORTAL_1 : SPRITES.PORTAL_2;
        drawSpriteAt(ctx, spr, px, py - 2, TILE_SIZE, 36);
        const phase = Math.floor(nowMs / 180) % 4;
        const offsets = [[8, 8], [22, 10], [10, 22], [20, 20]];
        const [ox, oy] = offsets[(phase + gx + gy) % 4];
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(px + ox, py + oy, 2, 2);
      } else if (type && type.startsWith("SPRING_")) {
        drawSpriteAt(ctx, SPRITES[type], px, py - 4, TILE_SIZE, 36);
      } else if (type && type.startsWith("MIRROR_")) {
        drawSpriteAt(ctx, SPRITES[type], px, py - 8, TILE_SIZE, 40);
      } else if (type === "K1" || type === "K2") {
        const bob = Math.round(Math.sin(nowMs / 220) * 2);
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(px + 10, py + 24, 12, 4);
        drawSpriteAt(ctx, SPRITES[type], px, py + bob - 2, TILE_SIZE, TILE_SIZE);
      }
    }

    function drawStandingObject(ctx, terrainType, occType, px, py, gatesFlipped, platesActive, turnNum, nowMs) {
      // 1. 地形立体建筑（向 Y 轴上方延展，底部对齐地板底边）
      if (terrainType === "T_W") {
        drawSpriteAt(ctx, SPRITES.T_W, px, py - 12, TILE_SIZE, 44);
      } else if (terrainType === "W") {
        drawSpriteAt(ctx, SPRITES.W, px, py - 12, TILE_SIZE, 44);
      } else if (terrainType === "R_GATE" && !gatesFlipped) {
        drawSpriteAt(ctx, SPRITES.R_GATE_CLOSED, px, py - 12, TILE_SIZE, 44);
      } else if (terrainType === "B_GATE" && gatesFlipped) {
        drawSpriteAt(ctx, SPRITES.B_GATE_CLOSED, px, py - 12, TILE_SIZE, 44);
      } else if (terrainType === "P_GATE" && !platesActive) {
        drawSpriteAt(ctx, SPRITES.P_GATE_CLOSED, px, py - 12, TILE_SIZE, 44);
      } else if (terrainType && terrainType.startsWith("LASER_")) {
        drawSpriteAt(ctx, SPRITES[terrainType], px, py - 12, TILE_SIZE, 44);
        if ((turnNum % 3 === 2 || turnNum % 3 === 0) && Math.floor(nowMs / 160) % 2 === 0) {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(px + 14, py - 2, 4, 4);
        }
      } else if (terrainType && terrainType.startsWith("LASER2_")) {
        drawSpriteAt(ctx, SPRITES[terrainType], px, py - 12, TILE_SIZE, 44);
        if ((turnNum % 4 === 3 || turnNum % 4 === 0) && Math.floor(nowMs / 140) % 2 === 0) {
          ctx.fillStyle = "#38bdf8";
          ctx.fillRect(px + 14, py - 2, 4, 4);
        }
      } else if (terrainType === "V") {
        drawSpriteAt(ctx, SPRITES.VAULT, px, py - 20, TILE_SIZE, 52);
      } else if (terrainType === "HEAL" || terrainType === "MIMIC" || terrainType === "CHEST") {
        let spr = SPRITES.CHEST_NORMAL;
        if (visionMode === "GOD") {
          spr = terrainType === "MIMIC" ? SPRITES.CHEST_MIMIC : SPRITES.CHEST_HEAL;
        }
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.fillRect(px + 4, py + 24, 24, 5);
        drawSpriteAt(ctx, spr, px, py - 8, TILE_SIZE, 40);
      }

      // 2. 实体层立体对象 (BOX / TNT)
      if (occType === "BOX") {
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(px + 3, py + 25, 26, 5);
        drawSpriteAt(ctx, SPRITES.BOX, px, py - 12, TILE_SIZE, 44);
      } else if (occType === "TNT") {
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(px + 4, py + 25, 24, 5);
        drawSpriteAt(ctx, SPRITES.TNT, px, py - 12, TILE_SIZE, 44);
        if (Math.floor(nowMs / 140) % 2 === 0) {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(px + 14, py - 12, 4, 4);
        }
      }
    }

    // 绘制 2.5D 像素 Q 版角色立绘（零蓝轨，迈步轻摇+起伏动画，未加载完成时回退像素骑士）
    function draw25DHeroCharacter(ctx, wx, wy, heroId, hp, jumpHeight, nowMs) {
      const heroKey = getAssetKey(isHumanMode ? "human" : heroId);
      const info = ASSET_MAP[heroKey];
      const sprImg = SPRITE_IMAGES[heroKey];
      const cx = Math.round(wx + TILE_SIZE / 2);

      // 1. 脚底像素风地面椭圆影（随跳跃高度缩放）
      const shadowScale = Math.max(0.45, 1 - jumpHeight / 28);
      const sw = Math.round(22 * shadowScale);
      const sh = Math.round(7 * shadowScale);
      ctx.fillStyle = "rgba(0, 0, 0, 0.58)";
      ctx.fillRect(cx - Math.round(sw / 2), Math.round(wy + TILE_SIZE - 4), sw, sh);

      let barTopY;
      if (spoilerMaskMystery && heroKey === "astra62") {
        // 神秘客 [???] 纯黑紫剪影态（防第8幕前剧透）
        const walkStep = heroIsMoving ? (Math.floor(nowMs / 110) % 2) : 0;
        const idleBob = heroIsMoving ? (walkStep * 2) : (Math.floor(nowMs / 320) % 2);
        const liftY = Math.round(jumpHeight + idleBob);
        const bodyTopY = Math.round(wy + 6 - liftY);
        const bodySpr = getHeroBodySprite("#0f172a", walkStep);
        ctx.drawImage(bodySpr, cx - 16, bodyTopY, 32, 32);
        const headY = bodyTopY - 6;
        ctx.save();
        ctx.fillStyle = "#090d16";
        ctx.beginPath();
        ctx.arc(cx, headY, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#a855f7";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#e879f9";
        ctx.font = "900 13px Consolas, monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("?", cx, headY + 1);
        ctx.restore();
        barTopY = headY - 21;
      } else if (sprImg && sprImg.complete && sprImg.naturalWidth > 0) {
        const spriteSize = 46;
        const walkBob = heroIsMoving ? Math.abs(Math.sin(nowMs / 85)) * 3.5 : Math.sin(nowMs / 360) * 1.0;
        const walkTilt = heroIsMoving ? Math.sin(nowMs / 85) * 0.065 : 0;
        const drawBottom = wy + TILE_SIZE - 1 - jumpHeight - walkBob;
        const drawTop = drawBottom - spriteSize;

        ctx.save();
        ctx.translate(cx, drawBottom - spriteSize / 2);
        if (walkTilt !== 0) ctx.rotate(walkTilt);
        // 官方 Q 版像素立绘默认微朝左，向右移动时镜像翻转
        if (heroKey !== "human" && heroFacing === "R") {
          ctx.scale(-1, 1);
        }
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(sprImg, -spriteSize / 2, -spriteSize / 2, spriteSize, spriteSize);
        ctx.imageSmoothingEnabled = false;
        ctx.restore();

        // 豆包专属 2.5D 像素铝锅盖头（无 Emoji 杂色）
        if (info.pot) {
          drawPixelPotHat(ctx, cx, drawTop - 7);
        }
        barTopY = drawTop - (info.pot ? 15 : 6);
      } else {
        // 立绘尚在加载时回退到 2.5D 像素骑士 + 头像徽章
        const walkStep = heroIsMoving ? (Math.floor(nowMs / 110) % 2) : 0;
        const idleBob = heroIsMoving ? (walkStep * 2) : (Math.floor(nowMs / 320) % 2);
        const liftY = Math.round(jumpHeight + idleBob);
        const bodySpr = getHeroBodySprite(info.color, walkStep);
        const bodyTopY = Math.round(wy + 6 - liftY);
        ctx.save();
        if (heroFacing === "L") {
          ctx.translate(cx, bodyTopY);
          ctx.scale(-1, 1);
          ctx.drawImage(bodySpr, -16, 0, 32, 32);
        } else {
          ctx.drawImage(bodySpr, cx - 16, bodyTopY, 32, 32);
        }
        ctx.restore();

        const headY = bodyTopY - 6;
        const headR = 11;
        ctx.save();
        ctx.fillStyle = "#090d16";
        ctx.beginPath();
        ctx.arc(cx, headY, headR + 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = isHumanMode ? "#fbbf24" : (info.color || "#38bdf8");
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, headY, headR, 0, Math.PI * 2);
        ctx.clip();

        const imgObj = AVATAR_IMAGES[isHumanMode ? "carbon" : heroKey] || AVATAR_IMAGES.astra;
        if (imgObj && imgObj.complete && imgObj.naturalWidth > 0) {
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(imgObj, cx - headR, headY - headR, headR * 2, headR * 2);
          ctx.imageSmoothingEnabled = false;
        } else {
          ctx.fillStyle = info.color || "#38bdf8";
          ctx.fillRect(cx - headR, headY - headR, headR * 2, headR * 2);
        }
        ctx.restore();

        if (info.pot) {
          drawPixelPotHat(ctx, cx, headY - headR - 11);
        }
        barTopY = headY - headR - (info.pot ? 18 : 8);
      }

      // 头顶像素风微缩 HP 血条
      if (document.body.classList.contains("cinema-clean-mode")) return;
      const barW = 28;
      const barH = 4;
      const barX = Math.round(cx - barW / 2);
      const barY = Math.round(barTopY);
      ctx.fillStyle = "#05070c";
      ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
      const ratio = Math.max(0, Math.min(1, hp / 100));
      ctx.fillStyle = hp > 50 ? "#22c55e" : (hp > 25 ? "#fbbf24" : "#f43f5e");
      ctx.fillRect(barX, barY, Math.round(barW * ratio), barH);
    }

    function drawFloatingCallout(ctx, cx, topY, text, bgColor = "#fbbf24", textColor = "#0f172a") {
      ctx.save();
      ctx.font = "900 10px 'Microsoft YaHei', sans-serif";
      const padX = 6;
      const tw = ctx.measureText(text).width + padX * 2;
      const th = 16;
      const bx = Math.round(cx - tw / 2);
      const by = Math.round(topY - th - 5);

      ctx.fillStyle = "rgba(0,0,0,0.65)";
      drawRoundedRect(ctx, bx + 1, by + 2, tw, th, 4);
      ctx.fill();

      ctx.fillStyle = bgColor;
      drawRoundedRect(ctx, bx, by, tw, th, 4);
      ctx.fill();
      ctx.strokeStyle = "#0f172a";
      ctx.lineWidth = 1.2;
      ctx.stroke();

      ctx.fillStyle = textColor;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, cx, by + th / 2 + 0.5);
      ctx.restore();
    }

    // ============================================================================
    // 5. 连续路径恒速插值与 60fps 渲染循环（彻底根除每格卡顿与上一格残影）
    // ============================================================================
    function getInterpolatedHeroWorldPos(prevFrame, frame, subProgress) {
      const path = buildOrderedHeroPath(prevFrame, frame);
      if (!path || path.length <= 1 || subProgress >= 1.0) {
        const end = frame.hero_pos;
        if (path && path.length >= 2) {
          const a = path[path.length - 2];
          const b = path[path.length - 1];
          if (b[0] < a[0]) heroFacing = "L";
          else if (b[0] > a[0]) heroFacing = "R";
        }
        heroIsMoving = false;
        return {
          wx: end[0] * TILE_SIZE,
          wy: end[1] * TILE_SIZE,
          jumpH: 0
        };
      }

      // 基于真实欧氏步长的恒速线性插值：跨越多格不刹车，连续走格不停顿
      let totalLen = 0;
      const segLens = [];
      for (let i = 0; i < path.length - 1; i++) {
        const dx = path[i + 1][0] - path[i][0];
        const dy = path[i + 1][1] - path[i][1];
        const len = Math.max(0.5, Math.hypot(dx, dy));
        segLens.push(len);
        totalLen += len;
      }

      // 自动播放时使用完全线性 progress，保证连续直行永不顿挫
      const progress = isPlaying ? subProgress : (subProgress * (2 - subProgress));
      let distTarget = progress * totalLen;
      let segIdx = 0;
      while (segIdx < segLens.length - 1 && distTarget > segLens[segIdx]) {
        distTarget -= segLens[segIdx];
        segIdx++;
      }

      const localT = segLens[segIdx] > 0 ? Math.min(1, Math.max(0, distTarget / segLens[segIdx])) : 1;
      const c0 = path[segIdx];
      const c1 = path[segIdx + 1];

      if (c1[0] < c0[0]) heroFacing = "L";
      else if (c1[0] > c0[0]) heroFacing = "R";
      heroIsMoving = true;

      const wx = (c0[0] + (c1[0] - c0[0]) * localT) * TILE_SIZE;
      const wy = (c0[1] + (c1[1] - c0[1]) * localT) * TILE_SIZE;

      const manhattanDist = Math.abs(c1[0] - c0[0]) + Math.abs(c1[1] - c0[1]);
      const jumpH = manhattanDist > 1 && manhattanDist <= 3 ? Math.sin(localT * Math.PI) * 18 : 0;

      return { wx, wy, jumpH };
    }

    // Ground-level atmosphere. Lighting fades into darkness; the moving mist
    // is drawn on the floor BEFORE tall objects and the actor, not across faces.
    const groundAtmosphere = { fog: null, mist: null, image: null,
      mistImage: null, staticNoise: null, distances: null, inside: null, maskKey: "", stamp: "" };
    function atmosphereNoise(x, y) {
      const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy;
      const u=fx*fx*(3-2*fx), v=fy*fy*(3-2*fy);
      const hash=(a,b)=>{
        let n=Math.imul(a,374761393)+Math.imul(b,668265263);
        n=Math.imul(n^(n>>>13),1274126177);
        return ((n^(n>>>16))>>>0)/4294967295;
      };
      return (hash(ix,iy)*(1-u)+hash(ix+1,iy)*u)*(1-v)
        +(hash(ix,iy+1)*(1-u)+hash(ix+1,iy+1)*u)*v;
    }
    function atmosphereSmooth(a,b,value) {
      const t=Math.max(0,Math.min(1,(value-a)/(b-a)));
      return t*t*(3-2*t);
    }
    function prepareGroundAtmosphere(visibleMask, nowMs, heroX, heroY) {
      const state=groundAtmosphere;
      const width=GRID_W*TILE_SIZE/4, height=GRID_H*TILE_SIZE/4;
      if (!state.fog) {
        for (const name of ["fog","mist"]) {
          state[name]=document.createElement("canvas");
          state[name].width=width;state[name].height=height;
        }
        state.image=state.fog.getContext("2d").createImageData(width,height);
        state.mistImage=state.mist.getContext("2d").createImageData(width,height);
        state.staticNoise=new Float32Array(width*height);
        for(let y=0;y<height;y++)for(let x=0;x<width;x++)
          state.staticNoise[y*width+x]=atmosphereNoise((x*4+2)*.018,(y*4+2)*.034);
      }
      const maskKey=visibleMask.map(row=>row.map(v=>v?"1":"0").join("")).join("");
      if (maskKey!==state.maskKey) {
        state.maskKey=maskKey;state.stamp="";
        state.inside=new Path2D();
        for(let y=0;y<GRID_H;y++)for(let x=0;x<GRID_W;x++)
          if(visibleMask[y][x])state.inside.rect(x*TILE_SIZE,y*TILE_SIZE,TILE_SIZE,TILE_SIZE);
        const distance=state.distances=new Float32Array(width*height);
        // Signed-mask feathering runs inward only: no blur can expose a cell
        // excluded by the 37-cell disc or by wall LOS.
        for(let y=0;y<height;y++)for(let x=0;x<width;x++) {
          if(!visibleMask[y>>3][x>>3])continue;
          const wx=x*4+2,wy=y*4+2,tx=x>>3,ty=y>>3;
          let nearest=48;
          for(let ny=ty-1;ny<=ty+1;ny++)for(let nx=tx-1;nx<=tx+1;nx++) {
            if(ny>=0&&ny<GRID_H&&nx>=0&&nx<GRID_W&&visibleMask[ny][nx])continue;
            const dx=Math.max(nx*TILE_SIZE-wx,0,wx-(nx+1)*TILE_SIZE);
            const dy=Math.max(ny*TILE_SIZE-wy,0,wy-(ny+1)*TILE_SIZE);
            nearest=Math.min(nearest,Math.hypot(dx,dy));
          }
          distance[y*width+x]=nearest;
        }
      }
      const stamp=Math.floor(nowMs/100)+":"+Math.round(heroX/2)+":"+Math.round(heroY/2);
      if(stamp===state.stamp)return;
      state.stamp=stamp;
      const t=nowMs*.001,pixels=state.image.data,mist=state.mistImage.data;
      for(let y=0;y<height;y++)for(let x=0;x<width;x++) {
        const wx=x*4+2,wy=y*4+2,index=(y*width+x)*4;
        const dx=wx-heroX,dy=(wy-heroY)*1.12;
        const radial=Math.hypot(dx,dy);
        const reach=Math.exp(-(dx*dx+dy*dy)/(112*112));
        // Non-periodic noise, with no rotating domains, tile centres or rings.
        const broad=radial<208?atmosphereNoise(wx*.018+t*.012,wy*.034-t*.004):state.staticNoise[y*width+x];
        const distance=state.distances[y*width+x];
        const low=distance>0?atmosphereNoise(wx*.042-t*.008+73,wy*.135+t*.003+19):0;
        const fine=distance>0?atmosphereNoise(wx*.115+31,wy*.19-67):0;
        const shade=10.5+reach*(9+broad*6)+(broad-.5)*1.8;
        pixels[index]=Math.round(shade*.86);
        pixels[index+1]=Math.round(shade*.98);
        pixels[index+2]=Math.round(shade*1.15+2);
        const dark=.035+.92*atmosphereSmooth(22,116,radial);
        const feather=1-atmosphereSmooth(0,28,distance);
        const alpha=distance===0?1:1-(1-dark)*(1-feather);
        pixels[index+3]=Math.round(alpha*255);
        // Long, low, very faint wisps hug the ground plane. At this speed a
        // strand drifts less than one world pixel per second and never rotates.
        const strand=atmosphereSmooth(.35,.70,broad*.25+low*.65+fine*.10);
        mist[index]=113;mist[index+1]=123;mist[index+2]=133;
        mist[index+3]=distance===0?0:Math.round(strand*reach*28
          *atmosphereSmooth(1,14,distance));
      }
      state.fog.getContext("2d").putImageData(state.image,0,0);
      state.mist.getContext("2d").putImageData(state.mistImage,0,0);
    }
    function drawFloorMist(context,heroX,heroY) {
      const state=groundAtmosphere;
      context.save();context.clip(state.inside);
      // A restrained pool of warm light belongs to the floor, not the camera.
      const glow=context.createRadialGradient(heroX,heroY,8,heroX,heroY,105);
      glow.addColorStop(0,"rgba(184,164,120,0.105)");
      glow.addColorStop(.55,"rgba(140,139,116,0.035)");
      glow.addColorStop(1,"rgba(140,139,116,0)");
      context.fillStyle=glow;context.fillRect(heroX-105,heroY-105,210,210);
      context.imageSmoothingEnabled=true;
      context.drawImage(state.mist,0,0,GRID_W*TILE_SIZE,GRID_H*TILE_SIZE);
      context.restore();
    }
    function drawAtmosphereFog(context,semi) {
      const state=groundAtmosphere;
      // One continuous pixel-aligned veil avoids the fine rectangular seams
      // caused by compositing separate inside/outside clipping paths.
      context.save();context.imageSmoothingEnabled=false;
      context.globalAlpha=semi ? .83 : 1;
      context.drawImage(state.fog,0,0,GRID_W*TILE_SIZE,GRID_H*TILE_SIZE);
      context.restore();
    }

    function renderLoop(nowMs) {
      requestAnimationFrame(renderLoop);
      const dt = Math.min(0.05, Math.max(0.001, (nowMs - lastRafMs) / 1000));
      lastRafMs = nowMs;

      if (!currentMatch || !currentMatch.frames || currentMatch.frames.length === 0) return;

      // 1. 先推进回合索引与累加时间，绝不先取旧 frame 再 advance（彻底消除退一格残影！）
      const turnDurationMs = 460 / playSpeed;
      if (isPlaying && !isHumanMode) {
        let elapsed = nowMs - lastTurnAdvanceTime;
        if (elapsed > turnDurationMs * 3) {
          lastTurnAdvanceTime = nowMs - turnDurationMs;
          elapsed = turnDurationMs;
        }
        while (elapsed >= turnDurationMs && currentFrameIdx < currentMatch.frames.length - 1) {
          advanceToFrame(currentFrameIdx + 1, lastTurnAdvanceTime + turnDurationMs, false);
          elapsed = nowMs - lastTurnAdvanceTime;
        }
        if (currentFrameIdx >= currentMatch.frames.length - 1 && elapsed >= turnDurationMs) {
          animSubProgress = 1.0;
          isPlaying = false;
          document.getElementById("playPauseBtn").textContent = "▶ 重播";
        } else {
          animSubProgress = Math.max(0, Math.min(1, elapsed / turnDurationMs));
        }
      } else {
        const elapsed = nowMs - lastTurnAdvanceTime;
        animSubProgress = Math.max(0, Math.min(1, elapsed / 170));
      }

      const frame = currentMatch.frames[currentFrameIdx];
      const prevFrame = currentFrameIdx > 0 ? currentMatch.frames[currentFrameIdx - 1] : null;
      if (!frame) return;

      // 2. 帧率无关指数阻尼镜头跟随
      const heroInterp = getInterpolatedHeroWorldPos(prevFrame, frame, animSubProgress);
      const worldW = GRID_W * TILE_SIZE;
      const worldH = GRID_H * TILE_SIZE;
      const camAlpha = 1 - Math.exp(-dt * 11.0);

      if (cameraFollow && !isDraggingCam) {
        targetZoom = Math.max(targetZoom, 1.5);
        const targetX = heroInterp.wx + TILE_SIZE / 2;
        const targetY = heroInterp.wy + TILE_SIZE / 2;
        camX += (targetX - camX) * camAlpha;
        camY += (targetY - camY) * camAlpha;
      } else if (!cameraFollow && !isDraggingCam) {
        targetZoom = 1.0;
        camX += (worldW / 2 - camX) * camAlpha;
        camY += (worldH / 2 - camY) * camAlpha;
      }
      camZoom += (targetZoom - camZoom) * camAlpha;

      // 3. 适配画布 DPR 并确保像素采样锐利
      const vp = document.getElementById("viewportCard");
      const dpr = window.devicePixelRatio || 1;
      const cw = vp.clientWidth;
      const ch = vp.clientHeight;
      const targetW = Math.floor(cw * dpr);
      const targetH = Math.floor(ch * dpr);
      if (canvas.width !== targetW || canvas.height !== targetH) {
        canvas.width = targetW;
        canvas.height = targetH;
      }

      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.imageSmoothingEnabled = false;

      ctx.fillStyle = visionMode === "GOD" ? "#070a11" : "#090a0e";
      ctx.fillRect(0, 0, cw, ch);

      const baseFitScale = Math.min((cw - 16) / worldW, (ch - 16) / worldH);
      const effectiveScale = baseFitScale * camZoom;

      let shakeX = 0, shakeY = 0;
      if (screenShake > 0.2) {
        shakeX = (Math.random() - 0.5) * screenShake;
        shakeY = (Math.random() - 0.5) * screenShake;
        screenShake *= Math.pow(0.02, dt);
      } else {
        screenShake = 0;
      }

      const halfViewW = (cw / 2) / effectiveScale;
      const halfViewH = (ch / 2) / effectiveScale;
      const clampedCamX = camZoom <= 1.05 ? worldW / 2 : Math.max(halfViewW * 0.72, Math.min(worldW - halfViewW * 0.72, camX));
      const clampedCamY = camZoom <= 1.05 ? worldH / 2 : Math.max(halfViewH * 0.72, Math.min(worldH - halfViewH * 0.72, camY));

      ctx.translate(cw / 2 + shakeX, ch / 2 + shakeY);
      ctx.scale(effectiveScale, effectiveScale);
      ctx.translate(-clampedCamX, -clampedCamY);

      const terrain = frame.terrain || [];
      const occupant = frame.occupant || [];
      const clues = frame.clues || [];
      const bombs = frame.bombs || [];
      const gatesFlipped = !!frame.gates_flipped;
      const platesActive = !!frame.plates_active;
      const turnNum = frame.turn || 0;

      const hasPlatesMap = terrain.some(r => Array.isArray(r) && (r.includes("PLATE") || r.includes("P_GATE")));
      const badgeEl = document.getElementById("platesHudBadge");
      if (badgeEl) {
        if (hasPlatesMap) {
          badgeEl.style.display = "block";
          badgeEl.classList.toggle("open", platesActive);
          badgeEl.textContent = platesActive ? "🔓 金色压板门: 已开启" : "🔒 金色压板门: 关闭 (须全箱压板)";
        } else {
          badgeEl.style.display = "none";
        }
      }

      const heroGridX = Math.max(0, Math.min(GRID_W - 1, Math.round(heroInterp.wx / TILE_SIZE)));
      const heroGridY = Math.max(0, Math.min(GRID_H - 1, Math.round(heroInterp.wy / TILE_SIZE)));
      // Visibility follows an actual simulation coordinate, never the interpolated
      // line between portal ends (which could reveal cells the hero never visited).
      const dynamicMask = computeDynamicVisibleMask(terrain, frame.hero_pos[0], frame.hero_pos[1], gatesFlipped, platesActive);
      const lightX=heroInterp.wx+TILE_SIZE/2, lightY=heroInterp.wy+TILE_SIZE*.72;
      if(visionMode!=="GOD")prepareGroundAtmosphere(dynamicMask,nowMs,lightX,lightY);

      const exposedSet = new Set();
      dynamicMask.forEach((row, y) => row.forEach((v, x) => { if (v) exposedSet.add(`${x},${y}`); }));

      // 计算严格视野裁切路径（用于第一人称 FOG 模式彻底截断激光/爆炸/炸弹）
      let fogClipPath = null;
      if (visionMode !== "GOD") {
        fogClipPath = new Path2D();
        for (let y = 0; y < GRID_H; y++) {
          for (let x = 0; x < GRID_W; x++) {
            if (exposedSet.has(`${x},${y}`)) {
              fogClipPath.rect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
          }
        }
      }

      // ==================== 第一遍：地板、机关、高墙地面投影 ====================
      for (let y = 0; y < GRID_H; y++) {
        const rowT = terrain[y] || [];
        const rowO = occupant[y] || [];
        const rowC = clues[y] || [];
        for (let x = 0; x < GRID_W; x++) {
          const isVis = dynamicMask[y][x];
          if (visionMode === "FOG" && !isVis) {
            ctx.fillStyle = "#080b10";
            ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            continue;
          }
          const t = rowT[x] || "EMPTY";
          const occCell = rowO[x] || null;
          const px = x * TILE_SIZE;
          const py = y * TILE_SIZE;
          drawFloorAndFlatTile(ctx, t, x, y, px, py, gatesFlipped, platesActive, occCell, nowMs);

          // 2.5D 高墙向南投下的环境阴影（大幅增强立体纵深感）
          if (t !== "PIT" && !isTallOccluder(terrain, x, y, gatesFlipped, platesActive) && isTallOccluder(terrain, x, y - 1, gatesFlipped, platesActive)) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.36)";
            ctx.fillRect(px, py, TILE_SIZE, 7);
          }

          if (rowC[x]) {
            drawSpriteAt(ctx, SPRITES.CLUE, px, py, TILE_SIZE, TILE_SIZE);
          }
        }
      }

      if(visionMode!=="GOD")drawFloorMist(ctx,lightX,lightY);

      // ==================== 第二遍：Y轴从北向南绘制 2.5D 立体物件、炸弹、宝箱与勇者 ====================
      const heroRowY = Math.min(GRID_H - 1, Math.max(0, Math.round(heroInterp.wy / TILE_SIZE)));
      const calloutQueue = [];
      const seenLabelKinds = new Set();
      const pushOnce = (kind, cx, topY, label, bg, fg) => {
        if (!seenLabelKinds.has(kind)) {
          seenLabelKinds.add(kind);
          calloutQueue.push([cx, topY, label, bg, fg]);
        }
      };

      for (let y = 0; y < GRID_H; y++) {
        const rowT = terrain[y] || [];
        const rowO = occupant[y] || [];
        const rowC = clues[y] || [];
        for (let x = 0; x < GRID_W; x++) {
          const isVis = dynamicMask[y][x];
          if (visionMode === "FOG" && !isVis) continue;

          const t = rowT[x] || "EMPTY";
          const occ = rowO[x] || null;
          const px = x * TILE_SIZE;
          const py = y * TILE_SIZE;

          drawStandingObject(ctx, t, occ, px, py, gatesFlipped, platesActive, turnNum, nowMs);

          if (showCalloutLabels && (isVis || visionMode !== "FOG")) {
            const cx = px + TILE_SIZE / 2;
            if (t === "K1") calloutQueue.push([cx, py - 2, "🔑 钥匙 K1", "#fbbf24", "#0f172a"]);
            else if (t === "K2") calloutQueue.push([cx, py - 2, "🔑 钥匙 K2", "#38bdf8", "#0f172a"]);
            else if (t === "V") calloutQueue.push([cx, py - 14, "🏆 终极金库", "#fbbf24", "#0f172a"]);
            else if (t === "T_W" && y === 0 && x >= 10) pushOnce("T_W", cx, py + 52, "🛡️ 钛金外墙(无敌)", "#475569", "#f8fafc");
            else if (t === "ICE") pushOnce("ICE", cx, py - 4, "🧊 单向冰面(滑到底)", "#38bdf8", "#0f172a");
            else if (t && t.startsWith("LASER_")) pushOnce("LASER", cx, py - 12, "🔴 红激光炮(3拍/-50)", "#f43f5e", "#ffffff");
            else if (t && t.startsWith("LASER2_")) pushOnce("LASER2", cx, py - 12, "🔵 蓝高频炮(4拍/-50)", "#0284c7", "#ffffff");
            else if (t === "PLATE") pushOnce("PLATE", cx, py - 4, "🟨 箱子压板(全箱触发)", "#facc15", "#0f172a");
            else if (t === "P_GATE") pushOnce("P_GATE", cx, py - 12, "🚪 金色压板门(防爆)", "#d97706", "#ffffff");
            else if (t && t.startsWith("ONEWAY_")) pushOnce("ONEWAY", cx, py - 4, "➡️ 单向通行门(防爆)", "#14b8a6", "#0f172a");
            else if (t === "W") pushOnce("W", cx, py - 12, "🧱 土黄砖墙(可炸)", "#f59e0b", "#0f172a");
            else if (t === "SWITCH") pushOnce("SWITCH", cx, py - 4, "🔵 按钮开关", "#60a5fa", "#0f172a");
            else if (t === "R_GATE") pushOnce("R_GATE", cx, py - 12, "🚪 红门(开关联动)", "#ef4444", "#ffffff");
            else if (t === "B_GATE") pushOnce("B_GATE", cx, py - 12, "🚪 蓝门(反相联动)", "#3b82f6", "#ffffff");
            else if (t && t.startsWith("PORTAL_1")) pushOnce(t, cx, py - 4, t === "PORTAL_1A" ? "🌀 紫传送门 A" : "🌀 紫传送门 B", "#c084fc", "#0f172a");
            else if (t && t.startsWith("PORTAL_2")) pushOnce(t, cx, py - 4, t === "PORTAL_2A" ? "🌀 蓝传送门 A" : "🌀 蓝传送门 B", "#38bdf8", "#0f172a");
            else if (t === "CRACK") pushOnce("CRACK", cx, py - 4, "⚠️ 脆冰(踩1次塌成坑)", "#94a3b8", "#0f172a");
            else if (t === "PIT") pushOnce("PIT", cx, py - 4, "🕳️ 无底深渊(-100血)", "#1e293b", "#f8fafc");
            else if (t === "HEAL") pushOnce("HEAL", cx, py - 10, "💛 金宝箱(+30血)", "#facc15", "#0f172a");
            else if (t === "MIMIC") pushOnce("MIMIC", cx, py - 10, "👹 假宝箱(-100血)", "#e11d48", "#ffffff");
            else if (t && t.startsWith("SPRING_")) pushOnce("SPRING", cx, py - 6, "🔼 单向弹簧(强飞3格)", "#4ade80", "#0f172a");
            else if (t && t.startsWith("MIRROR_")) pushOnce("MIRROR", cx, py - 10, "💎 反射镜(90°折射)", "#22d3ee", "#0f172a");
            if (rowC[x]) pushOnce("CLUE", cx, py - 4, "💀 白骨暗号(真伪线)", "#e2e8f0", "#0f172a");
            if (occ === "BOX") pushOnce("BOX", cx, py - 14, "📦 木箱(推/填坑/压板)", "#d97706", "#ffffff");
            if (occ === "TNT") pushOnce("TNT", cx, py - 14, "🧨 火药桶(3×3爆)", "#f43f5e", "#ffffff");
          }
        }

        // 同行定时炸弹：严格受 FOG 视野过滤
        bombs.forEach(b => {
          if (b.y === y) {
            if (visionMode === "FOG" && (!dynamicMask[b.y] || !dynamicMask[b.y][b.x])) return;
            const bx = b.x * TILE_SIZE;
            const by = b.y * TILE_SIZE;
            drawSpriteAt(ctx, SPRITES.BOMB, bx, by, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = "#ffffff";
            ctx.font = "900 11px Consolas, sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(String(b.timer), bx + 15, by + 19);
          }
        });

        if (y === heroRowY) {
          draw25DHeroCharacter(ctx, heroInterp.wx, heroInterp.wy, currentMatch.hero_id, frame.hero_hp, heroInterp.jumpH, nowMs);
        }
      }

      // ==================== 第三遍：红蓝双频激光齐射与爆炸 ====================
      const showTurnVfx = !isPlaying ? true : (animSubProgress > 0.15 && animSubProgress < 0.96);
      if (frame.events && showTurnVfx) {
        ctx.save();
        if (fogClipPath) ctx.clip(fogClipPath);

        frame.events.forEach(ev => {
          if (ev.type === "LASER_FIRE" && ev.beams) {
            ev.beams.forEach(bm => {
              if (!bm.cells || bm.cells.length === 0) return;
              const [c0x, c0y] = bm.cannon;
              const [lastX, lastY] = bm.cells[bm.cells.length - 1];
              const x1 = c0x * TILE_SIZE + TILE_SIZE / 2;
              const y1 = c0y * TILE_SIZE + TILE_SIZE / 2;
              const x2 = lastX * TILE_SIZE + TILE_SIZE / 2;
              const y2 = lastY * TILE_SIZE + TILE_SIZE / 2;
              const isBlueLaser = (bm.period === 4);

              ctx.strokeStyle = isBlueLaser ? "rgba(56, 189, 248, 0.58)" : "rgba(244, 63, 94, 0.50)";
              ctx.lineWidth = 12;
              ctx.lineCap = "round";
              ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();

              ctx.strokeStyle = isBlueLaser ? "#e0f2fe" : "#ffffff";
              ctx.lineWidth = 3.5;
              ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            });
          } else if (ev.type === "EXPLOSION_BATCH") {
            const cells = ev.blast_cells || ev.blast_zone || [];
            cells.forEach(([ex, ey]) => {
              const px = ex * TILE_SIZE;
              const py = ey * TILE_SIZE;
              ctx.fillStyle = "rgba(251, 146, 60, 0.72)";
              ctx.fillRect(px + 2, py + 2, TILE_SIZE - 4, TILE_SIZE - 4);
              ctx.fillStyle = "rgba(254, 240, 138, 0.88)";
              ctx.fillRect(px + 8, py + 8, TILE_SIZE - 16, TILE_SIZE - 16);
            });
          }
        });

        ctx.restore();
      }

      // Final darkness seals unknown geometry/effects. Ground mist was already
      // drawn below the actor; this veil feathers inward without changing LOS.
      if (visionMode !== "GOD") drawAtmosphereFog(ctx, visionMode === "SEMI");

      // ==================== 第五遍：可选临时路标与受击飘字 ====================
      if (showCalloutLabels) {
        calloutQueue.forEach(args => drawFloatingCallout(ctx, ...args));
      }

      floatingPopups = floatingPopups.filter(p => nowMs - p.born < 900);
      (document.body.classList.contains("cinema-clean-mode") ? [] : floatingPopups).forEach(p => {
        const age = (nowMs - p.born) / 900;
        ctx.save();
        ctx.font = "900 14px 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = p.color;
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 3;
        const py = p.wy - age * 26;
        ctx.strokeText(p.text, p.wx, py);
        ctx.fillText(p.text, p.wx, py);
        ctx.restore();
      });

      ctx.restore();
    }

    // ============================================================================
    // 6. 帧推进、对局切换与导播交互控制
    // ============================================================================
    function advanceToFrame(idx, stampMs = performance.now(), resetTimer = true) {
      if (!currentMatch || !currentMatch.frames) return;
      currentFrameIdx = Math.max(0, Math.min(currentMatch.frames.length - 1, idx));
      lastTurnAdvanceTime = stampMs;
      if (resetTimer) {
        animSubProgress = 0.0;
      }

      const frame = currentMatch.frames[currentFrameIdx];
      document.getElementById("frameSlider").value = currentFrameIdx;

      if (frame.events) {
        frame.events.forEach(ev => {
          if (ev.type === "DAMAGE") {
            const tot = (ev.trap_nominal || 0) + (ev.self_nominal || 0);
            floatingPopups.push({
              wx: frame.hero_pos[0] * TILE_SIZE + 16,
              wy: frame.hero_pos[1] * TILE_SIZE,
              text: `-${tot} HP`,
              color: "#f43f5e",
              born: stampMs
            });
            screenShake = 8;
          } else if (ev.type === "HEAL") {
            floatingPopups.push({
              wx: frame.hero_pos[0] * TILE_SIZE + 16,
              wy: frame.hero_pos[1] * TILE_SIZE,
              text: `+30 HP`,
              color: "#4ade80",
              born: stampMs
            });
          } else if (ev.type === "EXPLOSION_BATCH") {
            screenShake = 9;
          }
        });
      }
    }

    function loadMatchByIndex(idx) {
      const matches = bundleData.featured_matches || [];
      if (!matches[idx]) return;
      currentMatch = matches[idx];
      currentFrameIdx = 0;
      const selEl = document.getElementById("matchSelect");
      if (selEl && selEl.querySelector(`option[value="${idx}"]`)) selEl.value = String(idx);

      const slider = document.getElementById("frameSlider");
      slider.max = Math.max(0, currentMatch.frames.length - 1);
      slider.value = 0;

      if (currentMatch.mode === "BLIND" && visionMode === "GOD") {
        setVisionMode("SEMI");
      }

      const f0 = currentMatch.frames[0];
      camX = f0.hero_pos[0] * TILE_SIZE + 16;
      camY = f0.hero_pos[1] * TILE_SIZE + 16;
      heroFacing = "R";
      advanceToFrame(0, performance.now(), true);
      animSubProgress = 1.0;
    }

    function maskActorDisplay(name) {
      if (!spoilerMaskMystery || !name) return name;
      return String(name)
        .replace(/ASTRA\s*6\.2|astra_6\.2_medium|6\.2/gi, "神秘客 [???]")
        .replace(/\s*\(Fix\)/gi, "");
    }

    function populateMatchSelect() {
      const sel = document.getElementById("matchSelect");
      const prevIdx = sel.value;
      sel.innerHTML = "";
      const groups = [
        { key: "highlight", label: "⭐ 重点高能与反转焦点", items: [] },
        { key: "stage1",    label: "🏆 官方基准三图 (Stage 1)", items: [] },
        { key: "stage2",    label: "⚔️ 全交叉魔王战 (Stage 2)", items: [] },
        { key: "easter",    label: spoilerMaskMystery ? "🎭 赛后揭秘与对照 (神秘客 [???] & Opus 修正)" : "🎭 赛后揭秘与对照 (Astra 6.2 & Opus Fixed)", items: [] },
      ];
      const byKey = Object.fromEntries(groups.map(g => [g.key, g]));

      (bundleData.featured_matches || []).forEach((m, i) => {
        const icon = m.status === "CLEARED" ? "🎉" : (m.status === "DEAD" ? "💀" : (m.status === "DQ" ? "🚫[DQ]" : "⏳"));
        const rawTag = m.highlight_tag || EXTRA_DIRECTOR_TAGS[i + 1] || "";
        const tagText = maskActorDisplay(rawTag);
        const tag = tagText ? ` ${tagText} |` : "";
        const dName = maskActorDisplay(m.demon_name);
        const hName = maskActorDisplay(m.hero_name);
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `[#${i + 1}]${tag} ${dName} VS ${hName} (${m.turns}t) ${icon}`;
        if (rawTag) {
          byKey.highlight.items.push(opt);
        } else if (String(m.stage || "").startsWith("EasterEgg")) {
          byKey.easter.items.push(opt);
        } else if (String(m.stage || "").startsWith("Stage 1")) {
          byKey.stage1.items.push(opt);
        } else {
          byKey.stage2.items.push(opt);
        }
      });

      const hasGroups = byKey.highlight.items.length > 0 || byKey.easter.items.length > 0;
      for (const g of groups) {
        if (g.items.length === 0) continue;
        if (hasGroups) {
          const og = document.createElement("optgroup");
          og.label = `${g.label} (${g.items.length})`;
          g.items.forEach(opt => og.appendChild(opt));
          sel.appendChild(og);
        } else {
          g.items.forEach(opt => sel.appendChild(opt));
        }
      }
      if (prevIdx !== "" && sel.querySelector(`option[value="${prevIdx}"]`)) {
        sel.value = prevIdx;
      }
    }

    function toggleSpoilerMask() {
      spoilerMaskMystery = !spoilerMaskMystery;
      const btn = document.getElementById("spoilerBtn");
      btn.classList.toggle("active", spoilerMaskMystery);
      btn.textContent = spoilerMaskMystery ? "🕵️ 隐身???" : "🎭 全公开";
      populateMatchSelect();
    }

    function onSelectMatch(val) {
      if (isHumanMode) startHumanOnCurrentMatch(parseInt(val));
      else loadMatchByIndex(parseInt(val));
    }

    function togglePlay() {
      if (isHumanMode) return;
      if (!isPlaying && currentMatch && currentFrameIdx >= currentMatch.frames.length - 1) {
        currentFrameIdx = 0;
        advanceToFrame(0, performance.now(), true);
      }
      isPlaying = !isPlaying;
      document.getElementById("playPauseBtn").textContent = isPlaying ? "⏸ 暂停" : "▶ 播放";
      lastTurnAdvanceTime = performance.now();
    }

    function stepFrame(delta) {
      if (isHumanMode) return;
      isPlaying = false;
      document.getElementById("playPauseBtn").textContent = "▶ 播放";
      advanceToFrame(currentFrameIdx + delta, performance.now(), true);
    }

    function seekFrame(val) {
      if (isHumanMode) return;
      isPlaying = false;
      document.getElementById("playPauseBtn").textContent = "▶ 播放";
      advanceToFrame(parseInt(val), performance.now(), true);
      animSubProgress = 1.0;
    }

    function setPlaySpeed(spd) {
      playSpeed = spd;
      document.getElementById("spd1Btn").classList.toggle("active", spd === 1);
      document.getElementById("spd2Btn").classList.toggle("active", spd === 2);
      document.getElementById("spd4Btn").classList.toggle("active", spd === 4);
    }

    function setVisionMode(mode) {
      visionMode = mode;
      document.getElementById("visGodBtn").classList.toggle("active", mode === "GOD");
      document.getElementById("visSemiBtn").classList.toggle("active", mode === "SEMI");
      document.getElementById("visFogBtn").classList.toggle("active", mode === "FOG");
    }

    function toggleCameraMode() {
      cameraFollow = !cameraFollow;
      targetZoom = cameraFollow ? 2.05 : 1.0;
      const btn = document.getElementById("camModeBtn");
      btn.classList.toggle("active", cameraFollow);
      btn.textContent = cameraFollow ? "🎥 跟随" : "🗺️ 全景";
    }

    function toggleCalloutLabels() {
      showCalloutLabels = !showCalloutLabels;
      document.getElementById("toggleLabelsBtn").classList.toggle("active", showCalloutLabels);
    }

    function toggleCleanBroadcastMode() {
      document.body.classList.toggle("cinema-clean-mode");
      document.getElementById("cleanModeBtn").classList.toggle("active", document.body.classList.contains("cinema-clean-mode"));
    }

    function toggleHumanMode() {
      isHumanMode = !isHumanMode;
      const btn = document.getElementById("humanModeBtn");
      const banner = document.getElementById("humanBanner");
      if (isHumanMode) {
        isPlaying = false;
        btn.classList.add("human-active");
        btn.textContent = "🚪 退出";
        banner.classList.add("show");
        startHumanOnCurrentMatch(parseInt(document.getElementById("matchSelect").value || 0));
      } else {
        btn.classList.remove("human-active");
        btn.textContent = "🎮 踢馆";
        banner.classList.remove("show");
        loadMatchByIndex(parseInt(document.getElementById("matchSelect").value || 0));
      }
    }

    function startHumanOnCurrentMatch(matchIdx) {
      const baseMatch = (bundleData.featured_matches || [])[matchIdx] || (bundleData.featured_matches || [])[0];
      if (!baseMatch || !baseMatch.frames || !baseMatch.frames[0]) return;

      localSim = new ClientDungeonSimulator(baseMatch.frames[0], baseMatch);
      const initFrame = localSim.toFrame("START", 0);

      currentMatch = {
        ...baseMatch,
        hero_id: "human",
        hero_name: "人类 UP 主",
        frames: [initFrame]
      };
      currentFrameIdx = 0;
      humanPendingMod = null;
      document.getElementById("humanModIndicator").textContent = "";
      heroFacing = "R";
      camX = 2 * TILE_SIZE + 16;
      camY = 13 * TILE_SIZE + 16;
      advanceToFrame(0, performance.now(), true);
      animSubProgress = 1.0;
    }

    function executeHumanStep(action) {
      if (!isHumanMode || !localSim || localSim.status !== "ALIVE") return;
      const nextFrame = localSim.step(action);
      currentMatch.frames.push(nextFrame);
      advanceToFrame(currentMatch.frames.length - 1, performance.now(), true);
    }

    // 鼠标滚轮无级缩放与左键拖拽平移
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.22 : -0.22;
      targetZoom = Math.max(0.9, Math.min(3.5, targetZoom + delta));
    }, { passive: false });

    canvas.addEventListener("mousedown", (e) => {
      isDraggingCam = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDraggingCam) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      camX -= dx / camZoom;
      camY -= dy / camZoom;
    });

    window.addEventListener("mouseup", () => { isDraggingCam = false; });

    window.addEventListener("keydown", (e) => {
      if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName)) return;
      const k = e.key.toUpperCase();
      if (k === "H") { toggleCleanBroadcastMode(); return; }
      if (k === "M") { toggleSpoilerMask(); return; }
      if (k === "C") { toggleCameraMode(); return; }
      if (k === "F") {
        const order = ["GOD", "SEMI", "FOG"];
        setVisionMode(order[(order.indexOf(visionMode) + 1) % order.length]);
        return;
      }

      if (isHumanMode) {
        if (k === "R") {
          startHumanOnCurrentMatch(parseInt(document.getElementById("matchSelect").value || 0));
          return;
        }
        if (k === "J" || k === "K") {
          const mod = k === "J" ? "JUMP" : "THROW";
          humanPendingMod = humanPendingMod === mod ? null : mod;
          document.getElementById("humanModIndicator").textContent = humanPendingMod === "JUMP" ? "【方向键飞跃】" : humanPendingMod === "THROW" ? "【方向键飞石】" : "";
          return;
        }
        if (k === "B" || e.code === "Space") {
          e.preventDefault();
          executeHumanStep("BOMB");
          return;
        }
        if (k === "E") {
          e.preventDefault();
          executeHumanStep("WAIT");
          return;
        }
        const dirMap = { W: "U", ARROWUP: "U", S: "D", ARROWDOWN: "D", A: "L", ARROWLEFT: "L", D: "R", ARROWRIGHT: "R" };
        const d = dirMap[k] || dirMap[e.code.toUpperCase()];
        if (d) {
          e.preventDefault();
          let prefix = "MOVE";
          if (humanPendingMod) prefix = humanPendingMod;
          humanPendingMod = null;
          document.getElementById("humanModIndicator").textContent = "";
          executeHumanStep(`${prefix}_${d}`);
          if (e.shiftKey && prefix === "MOVE") executeHumanStep(`MOVE_${d}`);
        }
      } else {
        if (e.code === "Space") {
          e.preventDefault();
          togglePlay();
        } else if (e.code === "ArrowLeft" || k === "A") {
          stepFrame(-1);
        } else if (e.code === "ArrowRight" || k === "D") {
          stepFrame(1);
        }
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      buildPixelAtlas();
      populateMatchSelect();
      if (bundleData.featured_matches && bundleData.featured_matches.length > 0) {
        loadMatchByIndex(0);
      }
      requestAnimationFrame(renderLoop);
    });
  </script>
</body>
